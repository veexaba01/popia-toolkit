<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Personal data inventory - POPIA Toolkit</title>
    </head>

    <body>
        <h1>Personal data inventory</h1>
        
        <p><a th:href="@{/}">Back to home</a></p>

        <p><a th:href="@{/inventory/new}">Add an item</a></p>

        <p th:if="${items.isEmpty()}">No items recorded yet.</p>

        <p th:if="${param.created}"><strong>Item saved.</strong></p>

        <p th:if="${param.updated}"><strong>Item updated.</strong></p>

        <p th:if="${param.deleted}"><strong>Item deleted.</strong></p>

        <table th:if="${!items.isEmpty()}" border="1" cellpadding="6">
            <thead>
            <tr>
                <th>Name</th>
                <th>Purpose</th>
                <th>Stored in</th>
                <th>Special information</th>
                <th>Actions</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${items}">
                <td th:text="${item.name}"></td>
                <td th:text="${item.purpose}"></td>
                <td th:text="${item.storageLocation}"></td>
                <td th:text="${item.specialInformation} ? 'Yes' : 'No'"></td>
                <td>
                    <a th:href="@{/inventory/{id}/edit(id=${item.id})}">Edit</a>
                    <form th:if="${#authorization.expression('hasRole(''ADMIN'')')}"
                            th:action="@{/inventory/{id}/delete(id=${item.id})}" method="post">
                        <button type="submit">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </body>
</html>
