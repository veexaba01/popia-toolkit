<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>POPIA Toolkit</title>
    </head>

    <body>
        <h1>POPIA Toolkit</h1>
        <p>Logged in as <strong th:text="${email}"></strong>
            (<span th:each="role : ${roles}" th:text="${role}"></span>)</p>

        <form th:action="@{/logout}" method="post">
            <button type="submit">Log out</button>
        </form>
    </body>
</html>
