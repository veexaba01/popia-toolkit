<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
    <head>
        <meta charset="UTF-8">
        <title>Change password - POPIA Toolkit</title>
    </head>

    <body>
        <h1>Change your password</h1>
        <p><a th:href="@{/}">Back to home</a></p>

        <p th:if="${param.changed}"><strong>Your password was changed.</strong></p>

        <form th:action="@{/account/password}" th:object="${form}" method="post">
            <ul th:if="${#fields.hasGlobalErrors()}">
                <li th:each="err : ${#fields.globalErrors()}" th:text="${err}"></li>
            </ul>

            <p>
                <label>Current password
                    <input type="password" th:field="*{currentPassword}" autocomplete="current-password">
                </label>
                <span th:if="${#fields.hasErrors('currentPassword')}" th:errors="*{currentPassword}"></span>
            </p>

            <p>
                <label>New password (12 to 72 characters)
                    <input type="password" th:field="*{newPassword}" autocomplete="new-password">
                </label>
                <span th:if="${#fields.hasErrors('newPassword')}" th:errors="*{newPassword}"></span>
            </p>

            <p>
                <label>Repeat the new password
                    <input type="password" th:field="*{confirmPassword}" autocomplete="new-password">
                </label>
                <span th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></span>
            </p>

            <button type="submit">Change password</button>
        </form>
    </body>
</html>
